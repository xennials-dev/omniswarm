static_resources:
  listeners:
  - name: listener_0
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 8080
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: ingress_http
          codec_type: AUTO
          route_config:
            name: local_route
            virtual_hosts:
            - name: backend
              domains: ["*"]
              cors:
                allow_origin_string_match:
                - safe_regex:
                    google_re2: {}
                    regex: ".*"
                allow_methods: "GET, PUT, DELETE, POST, OPTIONS"
                allow_headers: "keep-alive,user-agent,cache-control,content-type,content-transfer-encoding,custom-header-1,x-accept-content-transfer-encoding,x-accept-response-streaming,x-user-agent,x-grpc-web,grpc-timeout"
                max_age: "1728000"
                expose_headers: "custom-header-1,grpc-status,grpc-message"
              routes:
              # gRPC & gRPC-Web Route for OmniSwarm Service
              - match:
                  prefix: "/omniswarm.v1.OmniSwarmBrokerService"
                route:
                  cluster: engine_broker_grpc_cluster
                  timeout: 0s
                  max_stream_duration:
                    grpc_timeout_header_max: 0s
              # Broker REST API
              - match:
                  prefix: "/api"
                route:
                  cluster: engine_broker_http_cluster
                  timeout: 60s
              # MCP Router Endpoints
              - match:
                  prefix: "/mcp"
                route:
                  cluster: engine_broker_http_cluster
                  timeout: 60s
              # Health check
              - match:
                  prefix: "/health"
                route:
                  cluster: engine_broker_http_cluster
              # Default route to Broker HTTP
              - match:
                  prefix: "/"
                route:
                  cluster: engine_broker_http_cluster
          http_filters:
          - name: envoy.filters.http.grpc_web
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.grpc_web.v3.GrpcWeb
          - name: envoy.filters.http.cors
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
  # HTTP/REST Cluster
  - name: engine_broker_http_cluster
    connect_timeout: 5s
    type: STRICT_DNS
    dns_lookup_family: V4_ONLY
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: engine_broker_http_cluster
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: engine-broker
                port_value: 8000

  # gRPC & gRPC-Web Cluster
  - name: engine_broker_grpc_cluster
    connect_timeout: 5s
    type: STRICT_DNS
    dns_lookup_family: V4_ONLY
    lb_policy: ROUND_ROBIN
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        explicit_http_config:
          http2_protocol_options: {}
    load_assignment:
      cluster_name: engine_broker_grpc_cluster
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: engine-broker
                port_value: 50051

admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9901
