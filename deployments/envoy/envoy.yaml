static_resources:
  listeners:
  - name: listener_0
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 8080
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: ingress_http
          codec_type: AUTO
          route_config:
            name: local_route
            virtual_hosts:
            - name: backend
              domains: ["*"]
              routes:
              # Broker API
              - match:
                  prefix: "/api"
                route:
                  cluster: engine_broker_cluster
                  timeout: 60s
              # MCP Router Endpoints
              - match:
                  prefix: "/mcp"
                route:
                  cluster: engine_broker_cluster
                  timeout: 60s
              # Health check
              - match:
                  prefix: "/health"
                route:
                  cluster: engine_broker_cluster
              # Default route to Broker
              - match:
                  prefix: "/"
                route:
                  cluster: engine_broker_cluster
          http_filters:
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
  - name: engine_broker_cluster
    connect_timeout: 5s
    type: STRICT_DNS
    dns_lookup_family: V4_ONLY
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: engine_broker_cluster
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: engine-broker
                port_value: 8000

admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9901
